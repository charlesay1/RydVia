name: Validate RydVia
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test secret scanner rejection and redaction
        run: node --test tests/security/secret-scan.test.mjs
      - name: Scan repository and full fetched Git history
        run: node scripts/scan-secrets.mjs --history
  web-and-database:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:admin-http
      - name: Token, native and brand asset checks
        shell: pwsh
        run: |
          ./scripts/test-tokens.ps1
          ./scripts/test-platforms.ps1
          node ./scripts/verify-brand-assets.mjs
  flutter:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve, check formatting, analyze, and test all Dart packages and apps
        shell: pwsh
        run: ./scripts/validate-flutter.ps1
  supabase-local:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
