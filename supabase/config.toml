project_id = "rydvia-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your RydVia verification code is {{ .Code }}"
max_frequency = "60s"

[auth.sms.twilio]
enabled = false
# Configure local provider secrets outside version control. No test OTP bypasses.

[realtime]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"
